[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-customer-lab"
version = "0.1.0"
description = "A deterministic local harness for synthetic customer simulations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
synlab = "synlab.cli:main"

[tool.setuptools.packages.find]
include = ["synlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
